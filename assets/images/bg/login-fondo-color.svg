<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9ecf1"/><stop offset=".55" stop-color="#d7dce5"/><stop offset="1" stop-color="#e3e1dc"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0d2a66"/><stop offset=".6" stop-color="#1f4aa8"/><stop offset="1" stop-color="#3f7be0"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3f6b2c"/><stop offset="1" stop-color="#7cb957"/></linearGradient>
    <linearGradient id="gTerra" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#a94a2a"/><stop offset="1" stop-color="#e8855a"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f2a81d"/><stop offset="1" stop-color="#ffd93a"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".5" stop-color="#d9a52c"/><stop offset="1" stop-color="#fff2b0"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
    <path id="leaf" d="M0 200 C0 85 85 0 200 0 C200 115 115 200 0 200 Z"/>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- aureola clara detrás de la tarjeta -->
  <ellipse cx="800" cy="450" rx="560" ry="460" fill="url(#halo)"/>

  <!-- sombras de color, suaves, desplazadas hacia abajo -->
  <g filter="url(#soft)" opacity=".38">
    <use href="#leaf" transform="translate(-244 -170) scale(3.6)" fill="#2f63d6"/>
    <use href="#leaf" transform="translate(-154 500) rotate(-18) scale(2.5)" fill="#5fa843"/>
    <use href="#leaf" transform="translate(166 730) rotate(18) scale(1.1)" fill="#e0703f"/>
    <use href="#leaf" transform="translate(1246 590) scale(2.8)" fill="#f5b524"/>
    <use href="#leaf" transform="translate(1026 770) rotate(-12) scale(.85)" fill="#e0703f"/>
    <use href="#leaf" transform="translate(1276 -40) rotate(90) scale(1.9)" fill="#5fa843"/>
    <use href="#leaf" transform="translate(1476 280) rotate(-40) scale(.9)" fill="#2f63d6"/>
  </g>

  <!-- esquina superior izquierda -->
  <use href="#leaf" transform="translate(-260 -200) scale(3.6)" fill="url(#gBlue)"/>
  <use href="#leaf" transform="translate(-260 -200) scale(3.6)" fill="none" stroke="url(#edge)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
  <!-- esquina inferior izquierda -->
  <use href="#leaf" transform="translate(-170 470) rotate(-18) scale(2.5)" fill="url(#gGreen)"/>
  <use href="#leaf" transform="translate(-170 470) rotate(-18) scale(2.5)" fill="none" stroke="url(#edge)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
  <use href="#leaf" transform="translate(150 700) rotate(18) scale(1.1)" fill="url(#gTerra)"/>
  <use href="#leaf" transform="translate(150 700) rotate(18) scale(1.1)" fill="none" stroke="url(#edge)" stroke-width="2" vector-effect="non-scaling-stroke"/>

  <!-- esquina inferior derecha -->
  <use href="#leaf" transform="translate(1230 560) scale(2.8)" fill="url(#gGold)"/>
  <use href="#leaf" transform="translate(1230 560) scale(2.8)" fill="none" stroke="url(#edge)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
  <use href="#leaf" transform="translate(1010 740) rotate(-12) scale(.85)" fill="url(#gTerra)"/>
  <use href="#leaf" transform="translate(1010 740) rotate(-12) scale(.85)" fill="none" stroke="url(#edge)" stroke-width="2" vector-effect="non-scaling-stroke"/>

  <!-- esquina superior derecha -->
  <use href="#leaf" transform="translate(1260 -70) rotate(90) scale(1.9)" fill="url(#gGreen)"/>
  <use href="#leaf" transform="translate(1260 -70) rotate(90) scale(1.9)" fill="none" stroke="url(#edge)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
  <use href="#leaf" transform="translate(1460 250) rotate(-40) scale(.9)" fill="url(#gBlue)"/>
  <use href="#leaf" transform="translate(1460 250) rotate(-40) scale(.9)" fill="none" stroke="url(#edge)" stroke-width="2" vector-effect="non-scaling-stroke"/>

  <!-- detalles -->
  <g fill="none" stroke="#25396f" stroke-opacity=".12">
    <circle cx="800" cy="450" r="470"/><circle cx="800" cy="450" r="560"/>
  </g>
  <g fill="#f2a81d">
    <circle cx="470" cy="150" r="5" fill-opacity=".9"/><circle cx="520" cy="190" r="3" fill-opacity=".7"/><circle cx="430" cy="205" r="2.5" fill-opacity=".7"/>
    <circle cx="1130" cy="800" r="5" fill-opacity=".9"/><circle cx="1085" cy="835" r="3" fill-opacity=".7"/>
  </g>
  <g fill="#435ebe" fill-opacity=".55">
    <circle cx="1150" cy="170" r="4"/><circle cx="1195" cy="205" r="2.5"/><circle cx="420" cy="760" r="4"/><circle cx="465" cy="800" r="2.5"/>
  </g>
</svg>
