<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16244d"/><stop offset=".55" stop-color="#2a4283"/><stop offset="1" stop-color="#435ebe"/>
    </linearGradient>
    <radialGradient id="glowGold" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fccf1d" stop-opacity=".30"/><stop offset="1" stop-color="#fccf1d" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowGreen" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fa04a" stop-opacity=".32"/><stop offset="1" stop-color="#5fa04a" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowTerra" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d96b3f" stop-opacity=".26"/><stop offset="1" stop-color="#d96b3f" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowSky" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8ba2ef" stop-opacity=".45"/><stop offset="1" stop-color="#8ba2ef" stop-opacity="0"/></radialGradient>
    <linearGradient id="leafW" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".02"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <path id="leaf" d="M0 200 C0 85 85 0 200 0 C200 115 115 200 0 200 Z"/>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/></pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- luces de color de la marca -->
  <circle cx="1400" cy="80" r="520" fill="url(#glowSky)"/>
  <circle cx="120" cy="820" r="480" fill="url(#glowGreen)"/>
  <circle cx="1450" cy="800" r="440" fill="url(#glowGold)"/>
  <circle cx="160" cy="90" r="360" fill="url(#glowTerra)"/>

  <!-- hojas (motivo de la «B») -->
  <g>
    <use href="#leaf" transform="translate(-70 40) rotate(8) scale(1.7)" fill="url(#leafW)"/>
    <use href="#leaf" transform="translate(120 420) rotate(-20) scale(1.05)" fill="#5fa04a" fill-opacity=".20"/>
    <use href="#leaf" transform="translate(40 560) rotate(60) scale(.7)" fill="#d96b3f" fill-opacity=".22"/>
    <use href="#leaf" transform="translate(1180 -60) rotate(100) scale(1.5)" fill="url(#leafW)"/>
    <use href="#leaf" transform="translate(1300 520) rotate(-8) scale(1.45)" fill="url(#leafW)"/>
    <use href="#leaf" transform="translate(1180 640) rotate(35) scale(.8)" fill="#fccf1d" fill-opacity=".16"/>
    <use href="#leaf" transform="translate(1440 330) rotate(-55) scale(.55)" fill="#5fa04a" fill-opacity=".20"/>
    <use href="#leaf" transform="translate(300 40) rotate(115) scale(.5)" fill="#fff" fill-opacity=".07"/>
  </g>

  <!-- anillos -->
  <g fill="none" stroke="#fff">
    <circle cx="1480" cy="120" r="260" stroke-opacity=".10"/>
    <circle cx="1480" cy="120" r="360" stroke-opacity=".06"/>
    <circle cx="90" cy="800" r="230" stroke-opacity=".10"/>
    <circle cx="90" cy="800" r="330" stroke-opacity=".06"/>
  </g>
  <circle cx="1480" cy="120" r="260" fill="none" stroke="#fccf1d" stroke-opacity=".30" stroke-width="1.5" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- olas inferiores -->
  <path d="M0 720 C260 650 480 790 760 730 S1260 640 1600 720 V900 H0 Z" fill="url(#wave)"/>
  <path d="M0 800 C300 740 560 860 880 800 S1350 740 1600 810 V900 H0 Z" fill="#fff" fill-opacity=".05"/>

  <!-- puntos decorativos -->
  <g fill="#fff" fill-opacity=".22">
    <circle cx="260" cy="250" r="3"/><circle cx="300" cy="290" r="2"/><circle cx="220" cy="310" r="2"/>
    <circle cx="1330" cy="440" r="3"/><circle cx="1370" cy="480" r="2"/><circle cx="1290" cy="500" r="2"/>
    <circle cx="1100" cy="150" r="2"/><circle cx="520" cy="840" r="2"/><circle cx="640" cy="60" r="2"/>
  </g>
</svg>
